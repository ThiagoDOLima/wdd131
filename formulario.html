<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avaliação de Produto</title>

    <meta name="description" content="Avalie nossos bolos e compartilhe sua experiência com nossos produtos.">

    <meta name="author" content="Thiago de Oliveira Lima">

    <!-- CSS -->
    <link href="formularios/css/formulario-normalize.css" rel="stylesheet">
    <link href="formularios/css/formulario-pequeno.css" rel="stylesheet">
    <link href="formularios/css/formulario-medio.css" rel="stylesheet">
    <link href="formularios/css/formulario-grande.css" rel="stylesheet">

    <!-- JavaScript -->
    <script src="formularios/js/formulario.js" defer></script>
</head>

<body>

    <header>
        <h1>Avalie nosso produto</h1>
        <p>Conte para nós como foi sua experiência.</p>
    </header>

    <main>

        <form method="GET" action="avaliacao.html" class="fw1">

            <!-- PRODUTO -->
            <fieldset>

                <legend>Produto</legend>

                <label for="produto">
                    Nome do Produto
                </label>

                <select id="produto" name="produto" required>

                    <option value="" disabled selected>
                        Selecione um produto
                    </option>

                    <option value="cenoura">
                        Bolo de Cenoura
                    </option>

                    <option value="fuba">
                        Bolo de Fubá
                    </option>

                    <option value="formigueiro">
                        Bolo Formigueiro
                    </option>

                    <option value="laranja">
                        Bolo de Laranja
                    </option>

                    <option value="milho">
                        Bolo de Milho
                    </option>

                    <option value="ninho">
                        Bolo de Leite Ninho
                    </option>

                    <option value="floresta">
                        Bolo Floresta Negra
                    </option>

                    <option value="brigadeiro">
                        Bolo de Brigadeiro
                    </option>

                </select>

                <label for="data">
                    Data da compra
                </label>

                <input type="date" id="data" name="data" required>

            </fieldset>


            <!-- CLASSIFICAÇÃO -->
            <fieldset>

                <legend>Classificação Geral</legend>

                <p>Como você avalia este produto?</p>



<div class="classificacao">

    <input type="radio" id="classificacao-1" name="classificacao" value="1" required>
    <label for="classificacao-1">
        <span>★</span>
    </label>

    <input type="radio" id="classificacao-2" name="classificacao" value="2" required>
    <label for="classificacao-2">
        <span>★★</span>
    </label>

    <input type="radio" id="classificacao-3" name="classificacao" value="3" required>
    <label for="classificacao-3">
        <span>★★★</span>
    </label>

    <input type="radio" id="classificacao-4" name="classificacao" value="4" required>
    <label for="classificacao-4">
        <span>★★★★</span>
    </label>

    <input type="radio" id="classificacao-5" name="classificacao" value="5" required>
    <label for="classificacao-5">
        <span>★★★★★</span>
    </label>

</div>

            </fieldset>


            <!-- CARACTERÍSTICAS -->

<fieldset>

    <legend>O que você mais valoriza?</legend>

    <p>
        Marque todas as opções que se aplicam:
    </p>

    <input type="checkbox"
        id="acucar"
        name="caracteristica"
        value="acucar">
    <label for="acucar">
        Equilíbrio no açúcar
    </label>

    <input type="checkbox"
        id="tamanho"
        name="caracteristica"
        value="tamanho">
    <label for="tamanho">
        Tamanho do bolo
    </label>

    <input type="checkbox"
        id="sabor"
        name="caracteristica"
        value="sabor">
    <label for="sabor">
        Sabor
    </label>

    <input type="checkbox"
        id="variedade"
        name="caracteristica"
        value="variedade">
    <label for="variedade">
        Variedade de sabores
    </label>

    <input type="checkbox"
        id="preco"
        name="caracteristica"
        value="preco">
    <label for="preco">
        Preço
    </label>

    <input type="checkbox"
        id="qualidade"
        name="caracteristica"
        value="qualidade">
    <label for="qualidade">
        Qualidade
    </label>

</fieldset>



            <!-- COMENTÁRIO -->
            <fieldset>

                <legend>Conte-nos sua experiência</legend>

                <label for="avaliacao">
                    Sua avaliação
                    <span class="opcional">(Opcional)</span>
                </label>

                <textarea id="avaliacao" name="avaliacao" rows="5"
                    placeholder="Conte o que você achou do produto..."></textarea>

            </fieldset>


            <!-- IDENTIFICAÇÃO -->
            <fieldset>

                <legend>Sobre você</legend>

                <label for="nome">
                    Seu nome
                    <span class="opcional">(Opcional)</span>
                </label>

                <input type="text" id="nome" name="nome" autocomplete="name">

            </fieldset>


            <!-- BOTÃO -->
            <input type="submit" value="Publicar Avaliação">

        </form>

    </main>


    <footer>

        <p>
            &copy;
            <span id="currentyear"></span>
            🌐 Thiago de Oliveira Lima |
            BYU-Pathway |
            WDD 131 2026
        </p>

        <p class="ultimaModificacao" id="ultimaModificacao">
        </p>

    </footer>

</body>

</html>
