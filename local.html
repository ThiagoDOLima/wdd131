<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S03 - Tarefa: Página do País</title>
    <meta name="description"
        content="Thiago Lima explora os fundamentos da Web Dinâmica no curso WDD 131, utilizando HTML, CSS e JavaScript para criar páginas interativas e responsivas.">
    <meta name="author" content="Thiago de Oliveira Lima">
    <!-- define o estilo base (mobile), sem media queries.-->
    <link rel="stylesheet" href="estilos/local.css">
    
    <!--contém as media queries (min-width: 768px) que sobrescrevem certas regras quando a tela é maior.-->
    <link rel="stylesheet" href="estilos/local-grande.css">
    
    <!-- Script JavaScript -->
    <script src="scripts/local.js" defer></script>
</head>

<body>

    <!-- 1. CABEÇALHO -->
    <header>
        <div class="logo">
            <h1>Brazil</h1>
            
        </div>       
        
    </header>
     
    
    <main>
        <!-- SEÇÃO HERO (Destaque) -->
        <section id="hero">
    
            <img src="imagens/paisagem.webp" alt="[Imagem Ilustrativa / Vídeo Demonstrativo]">
    
            <div class="data-box">
                <h2>Data</h2>
                <dl>
                    <div class="linha">
                        <dt>Area:</dt>
                        <dd>Value</dd>
                    </div>
                    <div class="linha">
                        <dt>Population:</dt>
                        <dd>Value</dd>
                    </div>
                    <div class="linha">
                        <dt>Capital:</dt>
                        <dd>Value</dd>
                    </div>
                    <div class="linha">
                        <dt>Languages:</dt>
                        <dd>Value</dd>
                    </div>
                    <div class="linha">
                        <dt>Currency:</dt>
                        <dd>Value</dd>
                    </div>
                    <div class="linha">
                        <dt>Time Zone:</dt>
                        <dd>Value</dd>
                    </div>
                    <div class="linha">
                        <dt>Calling Code:</dt>
                        <dd>Value</dd>
                    </div>
                    <div class="linha">
                        <dt>Internet TLD:</dt>
                        <dd>Value</dd>
                    </div>
                </dl>
            </div>
    
            <div class="weather-box">
                <h2>Clima ⛅</h2>
                <dl>
                    <div class="linha">
                        <dt>Temperature:</dt>
                        <dd>5°C</dd>
                    </div>
                    <div class="linha">
                        <dt>Wind:</dt>
                        <dd>20 km/h</dd>
                    </div>
                    <div class="linha">
                        <dt>Wind Chill:</dt>
                        <dd id="sensacaoTermica">N/A</dd>
                    </div>
                </dl>
            </div>
        </section>
    </main>

    <!-- 6. RODAPÉ (Footer) -->
    <footer>
        <!-- Primeiro parágrafo -->
        <p>
            &copy; <span id="currentyear"></span> 🌐 Thiago de Oliveira Lima | BYU-Pathway | WDD 131 2026
        </p>
        <!-- Segundo parágrafo -->
        <p class="ultimaModificacao" id="ultimaModificacao"></p>
    </footer>

</body>

</html>
